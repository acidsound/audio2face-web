<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DLP3D A2F · avatar rig (iOS)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0b0e14; color:#e6e6e6; }
  header { padding:12px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .pill { font-size:11px; padding:3px 8px; border-radius:999px; background:#1c2230; }
  .pill.ok { background:#15402a; color:#7ff0a8; }
  .pill.warn { background:#3a2a10; color:#ffcf6e; }
  main { padding:0 16px 24px; }
  #render { width:100%; height:55vh; min-height:320px; display:block; background:#11151f; border-radius:16px; touch-action:none; position:relative; }
  .hud { max-width:460px; margin:14px auto 0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .card { background:#151a26; border-radius:12px; padding:10px 12px; }
  .card .k { font-size:10px; opacity:.6; }
  .card .v { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .card .v small { font-size:10px; opacity:.6; font-weight:400; }
  button { width:100%; max-width:460px; margin:16px auto 0; display:block; padding:14px; font-size:15px; font-weight:600; border:0; border-radius:12px; background:#2b6cff; color:#fff; }
  #log { max-width:460px; margin:14px auto 0; font-size:11px; opacity:.65; white-space:pre-wrap; line-height:1.5; max-height:200px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>Audio2Face · avatar rig (GLB)</h1>
  <span id="ep" class="pill">EP: …</span>
  <span id="load" class="pill warn">대기</span>
</header>
<main>
  <canvas id="render"></canvas>
  <div class="hud">
    <div class="card"><div class="k">추론</div><div class="v"><span id="lat">–</span><small> ms</small></div></div>
    <div class="card"><div class="k">홉</div><div class="v"><span id="hop">–</span><small> ms</small></div></div>
    <div class="card"><div class="k">실시간</div><div class="v" id="rt">–</div></div>
  </div>
  <div class="hud">
    <div class="card"><div class="k">진행</div><div class="v" id="prog">0%</div></div>
    <div class="card"><div class="k">평균</div><div class="v"><span id="avg">–</span><small> ms</small></div></div>
    <div class="card"><div class="k">p95</div><div class="v"><span id="p95">–</span><small> ms</small></div></div>
  </div>
  <button id="play">▶ TTS + GLB 립싱크</button>
  <div id="log"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.0/babylon.max.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.54.0/babylonjs.loaders.min.js"></script>
<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.webgpu.min.mjs";

const SR=16000, WIN=0.05, HOP=0.05, TS_OUT=50, FRAME=51, LOOKAHEAD=2.0;
const DB_NAME="a2f-models", DB_VER=1, STORE="blobs";
const MODEL_URL="./models/unitalker_v0.4.0_base.int8.onnx";
const GLB_URL="./models/KQ-default_420.glb";
const FILES=["keqing_more_about_02.wav","keqing_more_about_03.wav","keqing_ascension_01.wav"];
const $ = id=>document.getElementById(id);
const log = m=>{ const el=$("log"); el.textContent+=m+"\n"; el.scrollTop=el.scrollHeight; };
ort.env.wasm.wasmPaths="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/";
ort.env.wasm.numThreads=Math.min(4, navigator.hardwareConcurrency||4);

let session=null, audioCtx=null, curSrc=null, stopFlag=false, playing=false, modelBufCache=null;
let scene=null, renderLoop=null, faceMesh=null, targetMgr=null, targetNames=[];

// UniTalker ARKit 51 → KQ VRM 61 target. 32(jawOpen)→あ amplified.
const MAP = {
  0:"まばたき", 1:"まばたき",
  8:"じと目", 9:"じと目", 10:"びっくり", 11:"びっくり",
  12:"口角上げ", 13:"口角上げ",
  14:"にこり", 15:"にこり", 16:"困る", 17:"困る",
  18:"あ", 19:"あ",
  26:"口横広げ", 27:"口横広げ",
  28:"ω", 29:"ω",
  32:"あ", 33:"あ", 34:"あ", 35:"あ",
  36:"あ", 37:"あ", 38:"お", 39:"お",
  40:"ω", 41:"ω", 42:"口角上げ", 43:"口角上げ",
  44:"舌広げ",
  45:"あ", 46:"口横狭め", 47:"ω", 48:"あ", 49:"え", 50:"い",
  51:"う", 52:"え", 53:"お", 54:"あ", 55:"い", 56:"う", 57:"お", 58:"あ", 59:"う", 60:"え"
};
// amp: per-target influence scale (jawOpen→あ boosted 1.5x for visible mouth)
const AMP = { "あ":1.5, "い":1.3, "う":1.3, "え":1.3, "お":1.3, "口横広げ":1.3, "口角上げ":1.3, "にこり":1.2, "まばたき":1.0 };

function getAudioCtx(){
  if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==="suspended"){ audioCtx.resume(); }
  return audioCtx;
}
function applyBlendshape(bs){
  if(!targetMgr) return;
  const LERP=0.30;  // faster than 0.15 for visible mouth motion
  const targetInf={};
  for(const k in MAP){
    const v=Math.max(0,Math.min(1,(bs[+k]||0)));
    const ti=targetNames.indexOf(MAP[k]);
    if(ti>=0){
      const amp = AMP[MAP[k]] || 1.0;
      targetInf[ti]=Math.max(targetInf[ti]||0, Math.min(1, v*amp));
    }
  }
  for(let i=0;i<targetMgr.numTargets;i++){
    const tgt=targetInf[i]||0;
    const cur=targetMgr.getTarget(i).influence||0;
    targetMgr.getTarget(i).influence = cur + (tgt-cur)*LERP;
  }
}
function resetMouth(){
  if(!targetMgr) return;
  for(let i=0;i<targetMgr.numTargets;i++){ targetMgr.getTarget(i).influence = 0; }
}
const latHist=[];
function record(dt){
  latHist.push(dt); if(latHist.length>600) latHist.shift();
  const mean=latHist.reduce((a,b)=>a+b,0)/latHist.length;
  $("lat").textContent=mean.toFixed(0);
  const ok=mean<HOP*1000; $("rt").textContent=ok?"OK ✓":"LAG ✗"; $("rt").style.color=ok?"#7ff0a8":"#ff9bb0";
}
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,DB_VER); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readonly"); const q=tx.objectStore(STORE).get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }
async function idbPut(k,buf){ try{ const db=await openDB(); await new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(buf,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
async function getModelBuffer(){
  const key=MODEL_URL.split("/").pop();
  if(modelBufCache) return modelBufCache;
  let cached=await idbGet(key);
  if(cached){ log("📦 캐시 히트: "+key); }
  else{
    log("⬇️ 다운로드: "+key);
    const resp=await fetch(MODEL_URL); const total=+resp.headers.get("content-length")||0;
    const reader=resp.body.getReader(); const chunks=[]; let got=0;
    while(true){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length; if(total) $("load").textContent=`다운로드 ${Math.floor(got/total*100)}%`; }
    const blob=new Uint8Array(got); let o=0; for(const c of chunks){ blob.set(c,o); o+=c.length; }
    cached=blob.buffer; await idbPut(key,cached);
  }
  modelBufCache=cached; return cached;
}
async function initModel(){
  if(session) return true;
  const t0=performance.now();
  try{
    const buf=await getModelBuffer();
    let s=null;
    try{ s=await ort.InferenceSession.create(buf,{executionProviders:["wasm"],graphOptimizationLevel:"all"}); }
    catch(e){ log("✗ 생성: "+e.message); if(s&&s.release) await s.release(); return false; }
    const wa=new ort.Tensor("float32",new Float32Array(WIN*SR),[1,WIN*SR]);
    const we=new ort.Tensor("int32",new Int32Array([1]),[1]);
    const wt=new ort.Tensor("int32",new Int32Array([TS_OUT]),[1]);
    for(let k=0;k<20;k++){ await s.run({audio:wa,emo_id:we,time_steps:wt}); }
    const real=new ort.Tensor("float32", new Float32Array(WIN*SR), [1, WIN*SR]);
    for(let k=0;k<10;k++){ await s.run({audio:real, emo_id:we, time_steps:wt}); }
    session=s;
    const dt=(performance.now()-t0)/1000;
    $("ep").textContent="EP: WASM·INT8"; $("ep").className="pill ok";
    $("load").textContent=`ready (${dt.toFixed(1)}s)`; $("load").className="pill ok";
    log(`✅ 로드 (${dt.toFixed(1)}s) + warmup`); return true;
  }catch(e){ log("✗ 모델: "+e.message); return false; }
}
async function loadAudio(url){
  const ac=getAudioCtx();
  const buf=await (await fetch(url)).arrayBuffer();
  const dec=await ac.decodeAudioData(buf);
  const ch=dec.getChannelData(0); const fromSR=dec.sampleRate;
  const n=Math.floor(ch.length*SR/fromSR); const idx=new Float32Array(n);
  for(let i=0;i<n;i++){ const p=i*fromSR/SR; const i0=Math.floor(p),i1=Math.min(i0+1,ch.length-1); idx[i]=ch[i0]+(p-i0)*(ch[i1]-ch[i0]); }
  return {idx,dec};
}
function stopPlay(){
  stopFlag=true; playing=false;
  try{ if(curSrc){ curSrc.onended=null; curSrc.stop(); } }catch(e){}
  curSrc=null;
  if(renderLoop){ renderLoop.stop(); renderLoop=null; }
  resetMouth();
  log("⏹ 정지");
}
async function play(){
  if(playing){ stopPlay(); await new Promise(r=>setTimeout(r,100)); }
  if(!session){ const ok=await initModel(); if(!ok){ log("모델 실패"); return; } }
  if(!faceMesh){ log("GLB 미로드 — 새로고침 필요"); return; }
  stopFlag=false; playing=true;
  $("hop").textContent=Math.round(HOP*1000);
  try{
  // cycle through files in order
  if(typeof play._fileIdx==="undefined") play._fileIdx=0;
  const url=FILES[play._fileIdx % FILES.length];
  play._fileIdx++;
  log("🎵 ["+play._fileIdx+"/"+FILES.length+"] "+url);
    const {idx,dec}=await loadAudio(url);
    const ac=getAudioCtx();
    const duration=dec.duration;
    const src=ac.createBufferSource(); src.buffer=dec; src.connect(ac.destination); curSrc=src;
    const winN=Math.floor(WIN*SR), hopN=Math.floor(HOP*SR);
    const total=Math.max(1, Math.floor((idx.length-winN)/hopN));
    const emo=new ort.Tensor("int32",new Int32Array([1]),[1]);
    const ts=new ort.Tensor("int32",new Int32Array([TS_OUT]),[1]);
    const pre=new ort.Tensor("float32",new Float32Array(winN),[1,winN]);
    for(let k=0;k<5;k++){ await session.run({audio:pre,emo_id:emo,time_steps:ts}); }
    const frames=new Array(total);
    let prodI=0, lastBS=null;
    const produce=async()=>{
      for(; prodI<total && !stopFlag; prodI++){
        const s=prodI*hopN, chunk=idx.subarray(s,s+winN);
        const aT=new ort.Tensor("float32",chunk,[1,chunk.length]);
        const ti=performance.now();
        const out=await session.run({audio:aT,emo_id:emo,time_steps:ts});
        const dt=performance.now()-ti; record(dt);
        frames[prodI]=out[Object.keys(out)[0]].data.slice(-FRAME);
        if(prodI%Math.ceil(total/10)===0) log(`… ${Math.floor(prodI/total*100)}%`);
        if(prodI%2===0) await new Promise(r=>setTimeout(r,0));
      }
    };
    const prodP=produce();
    const t0=ac.currentTime+LOOKAHEAD; src.start(t0);
    src.onended=()=>{ if(!stopFlag){ stopFlag=true; playing=false; resetMouth(); log("🔚 재생 종료"); } };
    const tick=()=>{
      if(stopFlag) return;
      const t=ac.currentTime-t0;
      const ci=Math.floor(t/HOP);
      if(ci>=0 && ci<total){
        if(frames[ci]) lastBS=frames[ci];
        if(lastBS) applyBlendshape(lastBS);
      }
      $("prog") && ($("prog").textContent=Math.min(100,Math.max(0,Math.floor(t/duration*100)))+"%");
      if(t<duration) requestAnimationFrame(tick);
    };
    tick();
    await prodP;
    if(!stopFlag){
      const mean=latHist.reduce((a,b)=>a+b,0)/latHist.length;
      const sorted=[...latHist].sort((a,b)=>a-b); const p95=sorted[Math.floor(sorted.length*0.95)];
      $("avg").textContent=mean.toFixed(0); $("p95").textContent=p95.toFixed(0);
      log(`✅ 평균 ${mean.toFixed(1)}ms / p95 ${p95.toFixed(1)}ms → ${mean<HOP*1000?"실시간 OK":"LAG"}`);
      playing=false;
    }
  }catch(e){ log("💥 play 에러: "+e.message); stopPlay(); }
}
$("play").onclick=()=>play();

let _ready=false;
function buildScene(){
  if(_ready||!window.BABYLON) return; _ready=true;
  const canvas=$("render");
  const eng=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
  const sc=new BABYLON.Scene(eng); sc.clearColor=new BABYLON.Color4(0.92, 0.92, 0.90, 1);
  // camera: KQ GLB face toward -Z. beta π/2.5 — slight downward look at face.
  const cam=new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/2.5, 3.5, BABYLON.Vector3.Zero(), sc);
  cam.attachControl(canvas,true);
  // HARD CLAMP: never enter mesh
  cam.lowerRadiusLimit=0.15;   // allow extreme close-up
  cam.upperRadiusLimit=20;
  cam.wheelDeltaPercentage=0.01;
  cam.pinchDeltaPercentage=0.01;
  cam.panningSensibility=0;
  cam.useBouncingBehavior=false;
  cam.useAutoRotationBehavior=false;
  cam.useFramingBehavior=false;

  // --- Manual shift+drag panning (ROOT FIX) ---
  // On shift: FULLY detach Babylon control so its internal math (which divides
  // by angularSensibility) can never run and produce NaN. We move target by hand.
  // alpha/beta are never touched -> they cannot NaN out.
  let _shiftDown=false, _panning=false, _lastX=0, _lastY=0;
  const _right=new BABYLON.Vector3(), _up=new BABYLON.Vector3();
  window.addEventListener("keydown",(e)=>{ if(e.key==="Shift" && !_shiftDown){
    _shiftDown=true;
    cam.detachControl();   // <-- kills Babylon pointer math entirely
  } });
  window.addEventListener("keyup",(e)=>{ if(e.key==="Shift"){
    _shiftDown=false; _panning=false;
    cam.attachControl(canvas, true);  // restore normal rotation/zoom
  } });
  canvas.addEventListener("pointerdown",(e)=>{
    if(_shiftDown){ _panning=true; _lastX=e.clientX; _lastY=e.clientY; }
  });
  window.addEventListener("pointermove",(e)=>{
    if(_shiftDown && _panning){
      const dx=e.clientX-_lastX, dy=e.clientY-_lastY;
      _lastX=e.clientX; _lastY=e.clientY;
      // camera basis from current alpha/beta (pure trig, finite if alpha/beta finite)
      cam.getDirectionToRef(BABYLON.Axis.X, _right);  // right
      cam.getDirectionToRef(BABYLON.Axis.Y, _up);     // up
      const panScale = cam.radius * 0.0015;
      const t=cam.target;
      const nx = t.x + (-dx*panScale)*_right.x + (dy*panScale)*_up.x;
      const ny = t.y + (-dx*panScale)*_right.y + (dy*panScale)*_up.y;
      const nz = t.z + (-dx*panScale)*_right.z + (dy*panScale)*_up.z;
      cam.setTarget(new BABYLON.Vector3(nx, ny, nz));  // setTarget keeps alpha/beta intact
    }
  });
  window.addEventListener("pointerup",()=>{ _panning=false; });
  canvas.addEventListener("pointerleave",()=>{ _panning=false; });
  // HUD overlay for live debug
  const hud=document.createElement("div");
  hud.id="dbg";
  hud.style.cssText="position:absolute;left:8px;top:8px;background:rgba(0,0,0,0.7);color:#7ff0a8;font:11px/1.4 monospace;padding:6px 10px;border-radius:6px;z-index:10;pointer-events:none;white-space:pre;";
  canvas.parentElement.appendChild(hud);
  sc.onBeforeRenderObservable.add(()=>{
    const t=cam.target;
    hud.textContent=`α=${(cam.alpha).toFixed(2)}  β=${(cam.beta).toFixed(2)}\nr=${cam.radius.toFixed(2)}  fov=${cam.fov.toFixed(2)}\ntarget=(${t.x.toFixed(2)}, ${t.y.toFixed(2)}, ${t.z.toFixed(2)})\nfaceW=${typeof faceW!=="undefined"?faceW.toFixed(2):"-"}\npan=${_shiftDown?"SHIFT+drag (detached)":"off"}`;
  });
  cam.fov=0.6; // standard portrait lens
  cam.minZ=0.01; // allow very near plane
  // 3-point studio lighting + white foam-board background (set after ImportMesh)
  // 1) KEY light: PointLight, near camera, soft, warm white → main illumination
  const keyLight=new BABYLON.PointLight("key", new BABYLON.Vector3(-0.4, 1.5, 1.5), sc);
  keyLight.intensity=2.5;
  keyLight.diffuse=new BABYLON.Color3(1.0, 0.96, 0.90);  // warm white
  keyLight.specular=new BABYLON.Color3(1, 0.98, 0.95);
  keyLight.range=10;
  // 2) FILL light: opposite side, dim, cool, fills shadow
  const fillLight=new BABYLON.PointLight("fill", new BABYLON.Vector3(1.5, 0.8, 1.0), sc);
  fillLight.intensity=0.6;
  fillLight.diffuse=new BABYLON.Color3(0.85, 0.88, 0.95);  // cool
  fillLight.specular=new BABYLON.Color3(0.5, 0.55, 0.65);
  fillLight.range=8;
  // 3) RIM light: from behind, strong, separates subject from bg
  const rimLight=new BABYLON.PointLight("rim", new BABYLON.Vector3(0, 1.0, -1.5), sc);
  rimLight.intensity=2.0;
  rimLight.diffuse=new BABYLON.Color3(1.0, 0.98, 0.95);
  rimLight.specular=new BABYLON.Color3(1, 1, 1);
  rimLight.range=6;
  // gentle ambient so deep shadows aren't black
  const hemi=new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), sc);
  hemi.intensity=0.4;
  hemi.diffuse=new BABYLON.Color3(0.95,0.95,1.0);
  hemi.groundColor=new BABYLON.Color3(0.7,0.7,0.72);
  scene=sc; renderLoop=eng;
  BABYLON.SceneLoader.ImportMesh("", "", GLB_URL, sc, (meshes)=>{
    // pick the face mesh (max morph targets)
    let best=null, bestN=0;
    for(const m of meshes){
      const tm=m.morphTargetManager;
      if(tm && tm.numTargets>bestN){ best=m; bestN=tm.numTargets; }
    }
    if(best){
      faceMesh=best; targetMgr=best.morphTargetManager;
      targetNames=[];
      for(let i=0;i<targetMgr.numTargets;i++){
        const t=targetMgr.getTarget(i);
        targetNames.push((best.geometry && best.geometry.extras && best.geometry.extras.targetNames && best.geometry.extras.targetNames[i]) || t.name || ("t"+i));
      }
    }
    if(!faceMesh){ log("⚠️ morph target 없음"); }
    else {
      log("🧊 GLB 로드 — morph targets: "+targetNames.length+"개");
      log("   あ OK: "+(targetNames.indexOf("あ")>=0));
      // --- Cell-shading outline: Babylon OutlineRenderer (core, distance-independent) ---
      // mesh.renderOutline draws a screen-pixel-width silhouette around each mesh
      // via the built-in OutlineRenderer (NOT the separate OutlineLayer class which
      // is not in babylon core). Width is in screen units so it stays constant at any zoom.
      const OUTLINE_PX = 0.001;   // uniform ultra-thin silhouette (all meshes)
      const outlineMat = new BABYLON.StandardMaterial("outlineProxyMat", sc);
      // ensure OutlineRenderer exists
      const orr = sc.getOutlineRenderer ? sc.getOutlineRenderer() : sc._outlineRenderer;
      if(orr){
        orr.renderableObjects = sc.meshes;
        log("   OutlineRenderer: OK");
      } else {
        log("   ⚠️ OutlineRenderer 없음");
      }
      // apply outline to every GLB mesh (uniform thin width; eye/lip/nose all outlined)
      for(let mi=0; mi<meshes.length; mi++){
        const m=meshes[mi];
        if(!m.getTotalVertices || m.getTotalVertices()===0) continue;
        if(m.name==="foamboard"||m.name==="floor") continue;
        m.renderOutline = true;
        m.outlineColor = new BABYLON.Color3(0.04, 0.04, 0.07);
        m.outlineWidth = OUTLINE_PX;
        m.outlineRendererEnabled = true;
      }
      // meshes[1] holds lip/nose geometry — force outline (slightly thicker so it reads)
      if(meshes[1] && meshes[1].getTotalVertices && meshes[1].getTotalVertices()>0){
        meshes[1].renderOutline = true;
        meshes[1].outlineColor = new BABYLON.Color3(0.04, 0.04, 0.07);
        meshes[1].outlineWidth = 0.002;
        meshes[1].outlineRendererEnabled = true;
        log("   meshes[1] (lip/nose) 강제 외곽선 적용");
      }
      log("   외곽선 적용 (OutlineRenderer, width="+OUTLINE_PX+", 거리무관)");
      // compute world bounding from ALL meshes
      let minY=Infinity,maxY=-Infinity,minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
      for(const m of sc.meshes){
        const b=m.getBoundingInfo().boundingBox;
        const lo=b.minimumWorld, hi=b.maximumWorld;
        minY=Math.min(minY,lo.y); maxY=Math.max(maxY,hi.y);
        minX=Math.min(minX,lo.x); maxX=Math.max(maxX,hi.x);
        minZ=Math.min(minZ,lo.z); maxZ=Math.max(maxZ,hi.z);
      }
      const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2;
      // aim at chin (~50% screen): chin at ~88% of body height
      const headY=minY+(maxY-minY)*0.88;
      // shoulderWidth as face width proxy
      const totalH = maxY-minY;
      const shoulderW = (maxX-minX);
      // face width is ~25% of shoulder width for typical anime
      const faceW = Math.max(0.08, shoulderW*0.25);
      // close-up: distance = faceW * 1.5 (inside-head), but clamp prevents
      const faceRadius = faceW * 3.0;   // back off — full head + shoulders visible
      const safeMin = faceW * 1.2;       // safer distance
      // === USER-CONFIRMED framing (captured from debug HUD on iPhone) ===
      // ROOT FIX for setTarget() discarding angles: pass cloneAlphaBetaRadius=true
      // so setTarget moves the target WITHOUT recomputing alpha/beta/radius.
      cam.alpha  = Math.PI/2;                       // 1.57
      cam.beta   = 1.66;                            // user-tuned
      cam.radius = 0.94;                            // user-tuned
      cam.fov    = 0.60;                            // portrait lens
      cam.setTarget(new BABYLON.Vector3(0.00, 1.38, -0.11), false, false, true); // cloneAlphaBetaRadius=true
      cam.lowerRadiusLimit = 0.15;                  // absolute floor; never overrides r=0.94
      cam.upperRadiusLimit = Math.max(8, totalH * 1.5);
      log("   카메라: faceW="+faceW.toFixed(2)+" radius="+cam.radius.toFixed(2)+" min=0.15 fov="+cam.fov.toFixed(2));
      // re-position lights relative to subject (cx, headY, cz)
      keyLight.position=new BABYLON.Vector3(cx-0.5, headY+0.6, cz+1.8);  // near camera, slightly left
      fillLight.position=new BABYLON.Vector3(cx+1.5, headY+0.2, cz+1.0);  // opposite
      rimLight.position=new BABYLON.Vector3(cx, headY+0.5, cz-1.6);  // from behind
      // camera direction: from -Z to +Z, alpha=-π/2 looks at +Z. Keep default.
      // HARD clamp every frame: radius + target kept in safe region
      // (alpha/beta are never modified by pan, so they cannot NaN out)
      const _minR = safeMin;
      const _txL = minX - (maxX-minX)*0.5, _txR = maxX + (maxX-minX)*0.5;
      const _tyL = minY - (maxY-minY)*0.3, _tyR = maxY + (maxY-minY)*0.3;
      const _tzL = minZ - (maxZ-minZ)*0.5, _tzR = maxZ + (maxZ-minZ)*0.5;
      sc.onBeforeRenderObservable.add(()=>{
        if(cam.radius < _minR) cam.radius = _minR;
        if(cam.radius > 20) cam.radius = 20;
        const t=cam.target;
        if(t.x<_txL) t.x=_txL; if(t.x>_txR) t.x=_txR;
        if(t.y<_tyL) t.y=_tyL; if(t.y>_tyR) t.y=_tyR;
        if(t.z<_tzL) t.z=_tzL; if(t.z>_tzR) t.z=_tzR;
      });
      // WHITE FOAM-BOARD background: large plane behind subject, always facing camera
      // camera is at alpha=π/2 (looking from -Z), so place board at +Z behind subject
      const board=BABYLON.MeshBuilder.CreatePlane("foamboard", {width: totalH*4, height: totalH*4}, sc);
      const boardMat=new BABYLON.StandardMaterial("boardMat", sc);
      boardMat.diffuseColor=new BABYLON.Color3(0.95, 0.95, 0.93);
      boardMat.specularColor=new BABYLON.Color3(0, 0, 0);
      boardMat.emissiveColor=new BABYLON.Color3(0.55, 0.55, 0.53);
      boardMat.backFaceCulling=false;
      board.material=boardMat;
      board.position=new BABYLON.Vector3(cx, (minY+maxY)/2, maxZ+totalH*0.6);
      board.renderingGroupId=-1;   // always drawn first → behind everything
      board.lookAt(new BABYLON.Vector3(cx, board.position.y, cz-10)); // face toward camera (-Z)
      // soft floor below for cyclorama feel
      const floor=BABYLON.MeshBuilder.CreateGround("floor", {width: totalH*4, height: totalH*1.5}, sc);
      const floorMat=new BABYLON.StandardMaterial("floorMat", sc);
      floorMat.diffuseColor=new BABYLON.Color3(0.85, 0.85, 0.83);
      floorMat.specularColor=new BABYLON.Color3(0,0,0);
      floor.material=floorMat;
      floor.position=new BABYLON.Vector3(cx, minY-0.02, cz);
      // idle: stop all default animations
      sc.animationGroups.forEach(g=>g.stop());
      log("   idle (애니매이션 정지) + 폼보드 배경");
    }
    eng.runRenderLoop(()=>sc.render());
  }, null, (sc2,msg)=>{ log("✗ GLB: "+msg); });
  window.addEventListener("resize",()=>eng.resize());
}
buildScene();
initModel().then(ok=>{ if(!ok) $("load").textContent="model: FAIL"; });
</script>
</body>
</html>
